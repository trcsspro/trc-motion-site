<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable · TRC Motion</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Fraunces:ital,opsz,wght@1,9..144,300..600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--nuit:#0E0C1A;--glace:#F6F2FF;--soft:rgba(246,242,255,.6);--violet:#7C5CFC;--rose:#FF3D7F;--cyan:#22D3EE}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--nuit);color:var(--glace);font-family:'Inter',sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;overflow:hidden;position:relative}
.au{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5}
.a1{width:50vw;height:50vw;background:var(--violet);top:-18%;left:-14%}
.a2{width:38vw;height:38vw;background:var(--rose);bottom:-16%;right:-10%}
.in{position:relative;z-index:2;max-width:480px}
.n{font-family:'Archivo Black',sans-serif;font-size:clamp(64px,14vw,120px);line-height:.9;letter-spacing:-.02em;background:linear-gradient(90deg,var(--violet),var(--rose),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-family:'Archivo Black',sans-serif;text-transform:uppercase;font-size:clamp(18px,3vw,24px);letter-spacing:-.01em;margin-top:18px}
p{color:var(--soft);font-size:15px;margin-top:12px;line-height:1.6}
p .ed{font-family:'Fraunces',serif;font-style:italic;color:var(--glace)}
a.btn{display:inline-flex;align-items:center;gap:8px;margin-top:32px;background:var(--glace);color:var(--nuit);padding:15px 30px;border-radius:999px;font-size:13px;font-weight:600;text-decoration:none}.pgft{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:22px;font-size:12px}.pgft a{color:var(--soft);text-decoration:none}
</style>
</head>
<body>
<div class="au a1"></div><div class="au a2"></div>
<div class="in">
  <div class="n">404</div>
  <h1>Cette page n'existe pas</h1>
  <p>Le lien est cass&eacute; ou la page a &eacute;t&eacute; d&eacute;plac&eacute;e. Retrouvez le site et les <span class="ed">vid&eacute;os</span> depuis l'accueil.</p>
  <a class="btn" href="/">Retour &agrave; l'accueil</a>
  <div class="pgft">
    <a href="/mentions-legales.html">Mentions l&eacute;gales</a>
    <a href="/politique-confidentialite.html">Confidentialit&eacute;</a>
  </div>
</div>
</body>
</html>
